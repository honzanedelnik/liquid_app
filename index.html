<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skladové Zásoby</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2b5c8f">
</head>
<body>
    <header>
        <h1>Skladové zásoby</h1>
    </header>

    <main>
        <section class="card">
            <h2>Přidat novou položku</h2>
            <form id="add-item-form">
                <input type="text" id="item-name" placeholder="Název položky" required>
                <input type="number" id="item-qty" placeholder="Počáteční ks" min="0" value="0" required>
                <button type="submit" class="btn btn-primary">Přidat</button>
            </form>
        </section>

        <section class="card">
            <input type="text" id="search-input" placeholder="Hledat v zásobách...">
        </section>

        <section class="card">
            <h2>Seznam položek</h2>
            <div id="items-list" class="items-list">
                <!-- Položky se načtou dynamicky -->
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
