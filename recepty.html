<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <title>Tvorba receptů</title>
  <style>
    :root {
      --primary: #007bff;
      --success: #28a745;
      --danger: #dc3545;
      --bg: #f8f9fa;
      --nav-bg: #ffffff;
      --nav-border: #e0e0e0;
      --text-inactive: #6c757d;
    }

    html, body {
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: 15px;
      padding-bottom: calc(75px + env(safe-area-inset-bottom, 0px));
      box-sizing: border-box;
      max-width: 650px;
      margin: 0 auto;
    }

    h2 { margin-top: 0; margin-bottom: 15px; }

    .card {
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 15px;
    }

    .form-group { margin-bottom: 10px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 0.9em; }
    
    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 16px;
    }

    .row-builder { display: flex; gap: 8px; margin-bottom: 10px; }
    .row-builder select { flex: 2; }
    .row-builder input { flex: 1; }

    .btn {
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-primary { background: var(--primary); color: white; width: 100%; }
    .btn-add { background: #6c757d; color: white; }
    .btn-danger { background: var(--danger); color: white; padding: 5px 8px; font-size: 0.8em; }

    .ingredient-list {
      background: #f1f3f5;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 12px;
      max-height: 120px;
      overflow-y: auto;
    }

    .ingredient-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      border-bottom: 1px solid #ddd;
    }

    .recipes-container { flex: 1; }

    .recipe-card {
      background: white;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .recipe-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #eee;
      padding-bottom: 8px;
      margin-bottom: 8px;
    }

    .recipe-title { font-weight: bold; font-size: 1.1em; }
    .recipe-ingredients { font-size: 0.9em; color: #495057; }

    /* SPODNÍ NAVIGACE */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background-color: var(--nav-bg);
      border-top: 1px solid var(--nav-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      height: 100%;
      color: var(--text-inactive);
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 500;
      gap: 3px;
    }

    .nav-item:active { transform: scale(0.94); }
    .nav-icon { width: 24px; height: 24px; fill: currentColor; }
    .nav-item.active { color: var(--primary); font-weight: bold; }
  </style>
</head>
<body>

  <h2>Tvorba receptů</h2>

  <div class="card">
    <div class="form-group">
      <label for="recipeName">Název receptu / sestavy:</label>
      <input type="text" id="recipeName" placeholder="např. Barva Odstín 402">
    </div>

    <label>Složení receptu:</label>
    <div class="row-builder">
      <select id="itemSelect">
        <option value="">-- Vyberte položku --</option>
      </select>
      <input type="number" id="itemQty" placeholder="Kusů" min="1" step="1">
      <button class="btn btn-add" onclick="addIngredient()">+ Přidat</button>
    </div>

    <div class="ingredient-list" id="tempIngredients">
      <small style="color:#6c757d">Zatím nebyly přidány žádné položky.</small>
    </div>

    <button class="btn btn-primary" onclick="saveRecipe()">Uložit nový recept</button>
  </div>

  <h3 style="margin-top:0;">Uložené recepty</h3>
  <div class="recipes-container" id="recipesList"></div>

  <!-- SPODNÍ NAVIGACE (Aktivní: Recepty) -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
      <span>Odečíst</span>
    </a>
    <a href="sklad.html" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 13H4v-2h16v2zm0-7H4V4h16v2zm0 14H4v-2h16v2z"/></svg>
      <span>Sklad</span>
    </a>
    <a href="recepty.html" class="nav-item active">
      <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
      <span>Recepty</span>
    </a>
  </nav>

  <script>
    let db;
    let skladItems = [];
    let currentIngredients = [];

    const request = indexedDB.open('SkladDB', 3);

    request.onsuccess = (e) => {
      db = e.target.result;
      loadSkladItems();
      renderRecipes();
    };

    function loadSkladItems() {
      const tx = db.transaction('sklad', 'readonly');
      const store = tx.objectStore('sklad');
      const req = store.getAll();

      req.onsuccess = () => {
        skladItems = req.result;
        const select = document.getElementById('itemSelect');
        select.innerHTML = '<option value="">-- Vyberte položku --</option>';
        
        skladItems.forEach(item => {
          const icon = item.jeBarvivo ? '🎨' : '📦';
          select.innerHTML += `<option value="${item.id}">${icon} ${item.nazev} (Skladem: ${item.zasoba}ks)</option>`;
        });
      };
    }

    function addIngredient() {
      const select = document.getElementById('itemSelect');
      const qtyInput = document.getElementById('itemQty');
      const itemId = Number(select.value);
      const qty = parseInt(qtyInput.value, 10);

      if (!itemId || isNaN(qty) || qty <= 0) {
        alert('Vyberte položku a zadejte platný počet kusů.');
        return;
      }

      const itemData = skladItems.find(i => i.id === itemId);
      const existing = currentIngredients.find(i => i.itemId === itemId);
      
      if (existing) {
        existing.qty += qty;
      } else {
        currentIngredients.push({ itemId: itemId, nazev: itemData.nazev, qty: qty });
      }

      select.value = '';
      qtyInput.value = '';
      renderTempIngredients();
    }

    function removeIngredient(index) {
      currentIngredients.splice(index, 1);
      renderTempIngredients();
    }

    function renderTempIngredients() {
      const container = document.getElementById('tempIngredients');
      if (currentIngredients.length === 0) {
        container.innerHTML = '<small style="color:#6c757d">Zatím nebyly přidány žádné položky.</small>';
        return;
      }

      container.innerHTML = currentIngredients.map((ing, idx) => `
        <div class="ingredient-item">
          <span><strong>${ing.nazev}</strong>: ${ing.qty} ks</span>
          <button class="btn btn-danger" onclick="removeIngredient(${idx})">✕</button>
        </div>
      `).join('');
    }

    function saveRecipe() {
      const name = document.getElementById('recipeName').value.trim();
      if (!name) { alert('Zadejte název receptu.'); return; }
      if (currentIngredients.length === 0) { alert('Recept musí obsahovat alespoň jednu položku.'); return; }

      const tx = db.transaction('recepty', 'readwrite');
      const store = tx.objectStore('recepty');
      store.add({ nazev: name, slozeni: currentIngredients });

      tx.oncomplete = () => {
        document.getElementById('recipeName').value = '';
        currentIngredients = [];
        renderTempIngredients();
        renderRecipes();
      };
    }

    function renderRecipes() {
      const container = document.getElementById('recipesList');
      container.innerHTML = '';

      const tx = db.transaction('recepty', 'readonly');
      const store = tx.objectStore('recepty');
      const req = store.getAll();

      req.onsuccess = () => {
        const recipes = req.result;
        recipes.forEach(recipe => {
          const ingredientsHtml = recipe.slozeni.map(i => `• ${i.nazev}: <strong>${i.qty} ks</strong>`).join('<br>');

          container.innerHTML += `
            <div class="recipe-card">
              <div class="recipe-header">
                <span class="recipe-title">${recipe.nazev}</span>
                <button class="btn btn-danger" onclick="deleteRecipe(${recipe.id})">Smazat</button>
              </div>
              <div class="recipe-ingredients">
                ${ingredientsHtml}
              </div>
            </div>
          `;
        });
      };
    }

    function deleteRecipe(id) {
      if (!confirm('Opravdu chcete tento recept smazat?')) return;
      const tx = db.transaction('recepty', 'readwrite');
      const store = tx.objectStore('recepty');
      store.delete(id);
      tx.oncomplete = () => renderRecipes();
    }
  </script>
</body>
</html>
