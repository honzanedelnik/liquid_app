<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <title>Skladové zásoby</title>
  <style>
    :root {
      --primary: #007bff;
      --danger: #dc3545;
      --bg: #f8f9fa;
      --nav-bg: #ffffff;
      --nav-border: #e0e0e0;
      --text-inactive: #6c757d;
    }

    html, body {
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: 15px;
      padding-bottom: calc(75px + env(safe-area-inset-bottom, 0px));
      box-sizing: border-box;
      max-width: 650px;
      margin: 0 auto;
    }

    h2 { margin-top: 0; margin-bottom: 15px; }

    .card {
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 15px;
    }

    .form-group { margin-bottom: 12px; }

    .form-group-checkbox {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      cursor: pointer;
    }

    .form-group-checkbox input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }

    .form-group-checkbox label { margin-bottom: 0; cursor: pointer; }

    label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 0.9em; }

    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 16px;
    }

    .btn-group { display: flex; gap: 10px; }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-cancel { background: #6c757d; color: white; }
    .btn-edit { background: #ffc107; color: #000; padding: 6px 10px; }
    .btn-delete { background: var(--danger); color: white; padding: 6px 10px; }

    .table-container {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      overflow-x: auto;
    }

    table { width: 100%; border-collapse: collapse; }

    th, td {
      padding: 10px 8px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    th {
      background: #e9ecef;
      font-size: 0.8em;
      text-transform: uppercase;
    }

    .actions { display: flex; gap: 5px; justify-content: flex-end; }
    .number-col { text-align: right; }
    .center-col { text-align: center; }

    .badge {
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.75em;
      font-weight: bold;
    }
    .badge-barvivo { background: #e3f2fd; color: #0d47a1; }
    .badge-ostatni { background: #f5f5f5; color: #616161; }

    /* SPODNÍ NAVIGACE */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background-color: var(--nav-bg);
      border-top: 1px solid var(--nav-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      height: 100%;
      color: var(--text-inactive);
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 500;
      gap: 3px;
    }

    .nav-item:active { transform: scale(0.94); }
    .nav-icon { width: 24px; height: 24px; fill: currentColor; }
    .nav-item.active { color: var(--primary); font-weight: bold; }
  </style>
</head>
<body>

  <h2>Skladové zásoby</h2>

  <div class="card">
    <input type="hidden" id="itemId">
    
    <div class="form-group">
      <label for="nazev">Název (max 30 znaků):</label>
      <input type="text" id="nazev" maxlength="30" placeholder="např. Červená pigmentová">
    </div>

    <div class="form-group">
      <label for="zasoba">Zásoba (celé číslo):</label>
      <input type="number" id="zasoba" step="1" placeholder="např. 150">
    </div>

    <div class="form-group-checkbox">
      <input type="checkbox" id="jeBarvivo" checked>
      <label for="jeBarvivo">Jedná se o barvivo</label>
    </div>

    <div class="btn-group">
      <button class="btn-primary" id="saveBtn" onclick="saveItem()">Uložit položku</button>
      <button class="btn-cancel" id="cancelBtn" onclick="resetForm()" style="display:none;">Zrušit</button>
    </div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th style="width: 8%;">ID</th>
          <th style="width: 37%;">Název</th>
          <th style="width: 20%; text-align: center;">Typ</th>
          <th style="width: 15%; text-align: right;">Zásoba</th>
          <th style="width: 20%; text-align: right;">Akce</th>
        </tr>
      </thead>
      <tbody id="dataTable"></tbody>
    </table>
  </div>

  <!-- SPODNÍ NAVIGACE (Aktivní: Sklad) -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
      <span>Odečíst</span>
    </a>
    <a href="sklad.html" class="nav-item active">
      <svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 13H4v-2h16v2zm0-7H4V4h16v2zm0 14H4v-2h16v2z"/></svg>
      <span>Sklad</span>
    </a>
    <a href="recepty.html" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
      <span>Recepty</span>
    </a>
  </nav>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    let db;
    const request = indexedDB.open('SkladDB', 3);

    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains('sklad')) {
        db.createObjectStore('sklad', { keyPath: 'id', autoIncrement: true });
      }
      if (!db.objectStoreNames.contains('recepty')) {
        db.createObjectStore('recepty', { keyPath: 'id', autoIncrement: true });
      }
    };

    request.onsuccess = (e) => {
      db = e.target.result;
      renderTable();
    };

    function saveItem() {
      const idInput = document.getElementById('itemId').value;
      const nazevInput = document.getElementById('nazev').value.trim();
      const zasobaInput = document.getElementById('zasoba').value;
      const jeBarvivoInput = document.getElementById('jeBarvivo').checked;

      if (!nazevInput) { alert('Vyplňte prosím název.'); return; }
      if (zasobaInput === '' || isNaN(zasobaInput)) { alert('Zadejte platnou zásobu.'); return; }

      const tx = db.transaction('sklad', 'readwrite');
      const store = tx.objectStore('sklad');
      const request = store.getAll();

      request.onsuccess = () => {
        const items = request.result;
        const existingItem = items.find(item => 
          item.nazev.toLowerCase() === nazevInput.toLowerCase() && item.id !== Number(idInput)
        );

        if (existingItem) {
          alert(`Položka s názvem "${nazevInput}" už existuje!`);
          return;
        }

        const itemData = {
          nazev: nazevInput.substring(0, 30),
          zasoba: parseInt(zasobaInput, 10),
          jeBarvivo: jeBarvivoInput
        };

        if (idInput) itemData.id = Number(idInput);
        store.put(itemData);
      };

      tx.oncomplete = () => { resetForm(); renderTable(); };
    }

    function renderTable() {
      const tbody = document.getElementById('dataTable');
      tbody.innerHTML = '';

      const tx = db.transaction('sklad', 'readonly');
      const store = tx.objectStore('sklad');
      const request = store.getAll();

      request.onsuccess = () => {
        const items = request.result;
        items.forEach(item => {
          const jeBarvivo = item.jeBarvivo !== undefined ? item.jeBarvivo : true;
          const typBadge = jeBarvivo 
            ? '<span class="badge badge-barvivo">🎨 Barvivo</span>' 
            : '<span class="badge badge-ostatni">📦 Ostatní</span>';

          tbody.innerHTML += `
            <tr>
              <td><strong>#${item.id}</strong></td>
              <td>${escapeHtml(item.nazev)}</td>
              <td class="center-col">${typBadge}</td>
              <td class="number-col">${item.zasoba}</td>
              <td class="actions">
                <button class="btn-edit" onclick="editItem(${item.id}, '${escapeHtml(item.nazev)}', ${item.zasoba}, ${jeBarvivo})">✏️</button>
                <button class="btn-delete" onclick="deleteItem(${item.id})">🗑️</button>
              </td>
            </tr>
          `;
        });
      };
    }

    function editItem(id, nazev, zasoba, jeBarvivo) {
      document.getElementById('itemId').value = id;
      document.getElementById('nazev').value = nazev;
      document.getElementById('zasoba').value = zasoba;
      document.getElementById('jeBarvivo').checked = jeBarvivo;
      
      document.getElementById('saveBtn').innerText = 'Přepsat položku';
      document.getElementById('cancelBtn').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteItem(id) {
      if (!confirm('Opravdu chcete tuto položku smazat?')) return;
      const tx = db.transaction('sklad', 'readwrite');
      const store = tx.objectStore('sklad');
      store.delete(id);
      tx.oncomplete = () => renderTable();
    }

    function resetForm() {
      document.getElementById('itemId').value = '';
      document.getElementById('nazev').value = '';
      document.getElementById('zasoba').value = '';
      document.getElementById('jeBarvivo').checked = true;
      document.getElementById('saveBtn').innerText = 'Uložit položku';
      document.getElementById('cancelBtn').style.display = 'none';
    }

    function escapeHtml(text) {
      return text.replace(/'/g, "&#39;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
